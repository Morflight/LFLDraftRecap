<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>LFL Draft Recap</title>
<style>
  :root {
    --ink: #222;
    --muted: #666;
    --border: #bbb;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    margin: 0;
    padding: 20px;
    max-width: 1600px;
    margin-left: auto;
    margin-right: auto;
  }
  h1 { margin: 0 0 4px; }
  h2 { margin: 28px 0 10px; font-size: 18px; }
  p.lede { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .controls label { font-size: 13px; color: var(--muted); }
  .controls input[type="text"], .controls select {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 13px;
    background: #fff;
  }
  .controls input[type="text"] { min-width: 240px; }
  .controls button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    border-radius: 4px;
    font-size: 13px;
  }
  .controls button:hover { background: #eee; }
  #status {
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--muted);
    min-height: 1.2em;
  }
  .copy-btn {
    display: inline-block;
    margin: 4px 0 12px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  .copy-btn:hover { background: #eee; }
  .game .winlabel {
    font-size: 12px;
    color: #444;
    margin-bottom: 2px;
    min-height: 14px;
  }
  table.draft, table.picks {
    border-collapse: collapse;
    font-size: 12px;
    width: 100%;
  }
  table.draft td, table.draft th,
  table.picks td, table.picks th {
    border: 1px solid #999;
    padding: 2px 6px;
    text-align: left;
    height: 18px;
  }
  table.draft tr.sep td { border: none; height: 6px; padding: 0; }
  table.picks caption {
    caption-side: top;
    text-align: center;
    font-weight: bold;
    padding: 4px;
  }
  .aggregate-wrap {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 20px;
    margin-top: 10px;
  }
  .copy-hint {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <h1>LFL Draft Recap</h1>
  <p class="lede">
    Entre un nom d'équipe LeaguePedia. L'outil charge sa page Pick-Ban History + les Scoreboard Players,
    puis rend la grille de drafts et l'agrégat "Competitive picks" par joueur.
  </p>

  <div class="controls">
    <label>Équipe LFL
      <select id="team-select" disabled><option>(chargement liste...)</option></select>
    </label>
    <label>ou autre
      <input id="team" type="text" placeholder="ex: G2 Esports" />
    </label>
    <label>Tournoi
      <select id="tournament" disabled><option>(charger d'abord)</option></select>
    </label>
    <button id="load">Charger</button>
  </div>

  <div id="status"></div>

  <button id="copy-all" type="button" class="copy-btn" style="display:none">
    📋 Copier tout (drafts + competitive picks) dans le presse-papiers
  </button>

  <h2 id="games-head" style="display:none">Drafts par game</h2>
  <div id="games"></div>

  <h2 id="picks-head" style="display:none">Competitive picks par joueur</h2>
  <div id="picks" class="aggregate-wrap"></div>

<script>
'use strict';

const API = 'https://lol.fandom.com/api.php';

const COLORS = {
  pickBlue:  '#c9ddf4',
  pickRed:   '#f4c9c9',
  banGrey:   '#bfbfbf',
  headerBlue:'#2b5cb3',
  headerRed: '#b32b2b',
  headerInk: '#ffffff',
  aggFirst:  '#f9d8bc',
};

// Layout rows — matches the reference template exactly.
// Each entry is { blue, red } draft slots, or type 'sep' for a blank separator.
// Slot: { kind: 'ban'|'pick', n: 1..5 }. Phase = 1 (n<=3) or 2 (n>=4).
const LAYOUT = [
  { blue:{kind:'ban', n:1}, red:{kind:'ban', n:1} },
  { blue:{kind:'ban', n:2}, red:{kind:'ban', n:2} },
  { blue:{kind:'ban', n:3}, red:{kind:'ban', n:3} },
  { blue:{kind:'pick',n:1}, red:{kind:'pick',n:1} },
  { blue:null,              red:{kind:'pick',n:2} },
  { sep:true },
  { blue:{kind:'pick',n:2}, red:null },
  { blue:{kind:'pick',n:3}, red:null },
  { sep:true },
  { blue:null,              red:{kind:'pick',n:3} },
  { sep:true },
  { blue:{kind:'ban', n:4}, red:{kind:'ban', n:4} },
  { blue:{kind:'ban', n:5}, red:{kind:'ban', n:5} },
  { blue:null,              red:{kind:'pick',n:4} },
  { sep:true },
  { blue:{kind:'pick',n:4}, red:null },
  { blue:{kind:'pick',n:5}, red:null },
  { blue:null,              red:{kind:'pick',n:5} },
];

// Standard competitive draft sequence — 20 slots in chronological order.
// Used to index data-c1/data-c2 champions from the pbh-table row.
const DRAFT_SEQUENCE = [
  {kind:'ban', side:'B', n:1}, {kind:'ban', side:'R', n:1},
  {kind:'ban', side:'B', n:2}, {kind:'ban', side:'R', n:2},
  {kind:'ban', side:'B', n:3}, {kind:'ban', side:'R', n:3},
  {kind:'pick',side:'B', n:1}, {kind:'pick',side:'R', n:1},
  {kind:'pick',side:'R', n:2}, {kind:'pick',side:'B', n:2},
  {kind:'pick',side:'B', n:3}, {kind:'pick',side:'R', n:3},
  {kind:'ban', side:'R', n:4}, {kind:'ban', side:'B', n:4},
  {kind:'ban', side:'R', n:5}, {kind:'ban', side:'B', n:5},
  {kind:'pick',side:'R', n:4}, {kind:'pick',side:'B', n:4},
  {kind:'pick',side:'B', n:5}, {kind:'pick',side:'R', n:5},
];

const ROLE_ORDER = ['Top', 'Jungle', 'Mid', 'Bot', 'Support'];

const CURRENT_SPLIT = 'LFL/2026 Season/Spring Split';

const $ = (s) => document.querySelector(s);
const statusEl = $('#status');
const tournamentEl = $('#tournament');
const teamSelectEl = $('#team-select');
const teamInputEl = $('#team');

let gamesAll = [];
let playersRows = [];
let loadedTeam = '';
let lastSpError = null;

$('#load').addEventListener('click', onLoad);
tournamentEl.addEventListener('change', renderAll);
teamSelectEl.addEventListener('change', () => { teamInputEl.value = teamSelectEl.value; });
$('#copy-all').addEventListener('click', (e) => copyAll(e.currentTarget));

const TEAMS_CACHE_KEY = 'lfl-draft-recap:teams:' + CURRENT_SPLIT;
const TEAMS_CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 24h

function populateTeams(teams) {
  if (!teams || !teams.length) {
    teamSelectEl.innerHTML = '<option>(liste indisponible)</option>';
    return;
  }
  teamSelectEl.innerHTML = '<option value="">(choisir...)</option>' +
    teams.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  teamSelectEl.disabled = false;
}

function readTeamsCache() {
  try {
    const raw = localStorage.getItem(TEAMS_CACHE_KEY);
    if (!raw) return null;
    const { at, teams } = JSON.parse(raw);
    if (Date.now() - at > TEAMS_CACHE_TTL_MS) return null;
    return teams;
  } catch { return null; }
}
function writeTeamsCache(teams) {
  try {
    localStorage.setItem(TEAMS_CACHE_KEY, JSON.stringify({ at: Date.now(), teams }));
  } catch {}
}

async function fetchTeamsList() {
  // Try TournamentRosters first, fall back to distinct teams from ScoreboardGames.
  const base = `${API}?action=cargoquery&format=json&origin=*`;
  const where = encodeURIComponent(`OverviewPage="${CURRENT_SPLIT}"`);
  const tryUrl = async (url) => {
    for (let attempt = 0; attempt < 3; attempt++) {
      const r = await fetch(url);
      const data = await r.json().catch(() => ({}));
      if (data.error && data.error.code === 'ratelimited') {
        await new Promise(res => setTimeout(res, 1500 * (attempt + 1)));
        continue;
      }
      return data.cargoquery || [];
    }
    throw new Error('rate-limit persistant');
  };
  const rosters = await tryUrl(`${base}&tables=TournamentRosters&fields=Team&where=${where}`);
  let teams = rosters.map(x => x.title.Team).filter(Boolean);
  if (!teams.length) {
    const games = await tryUrl(`${base}&tables=ScoreboardGames&fields=Team1,Team2&where=${where}&limit=200`);
    const set = new Set();
    for (const g of games) { if (g.title.Team1) set.add(g.title.Team1); if (g.title.Team2) set.add(g.title.Team2); }
    teams = Array.from(set);
  }
  return Array.from(new Set(teams)).sort();
}

(async function initTeams() {
  const cached = readTeamsCache();
  if (cached) populateTeams(cached);
  else teamSelectEl.innerHTML = '<option>(chargement...)</option>';
  try {
    const teams = await fetchTeamsList();
    if (teams.length) {
      writeTeamsCache(teams);
      populateTeams(teams);
    } else if (!cached) {
      teamSelectEl.innerHTML = '<option>(aucune équipe — Fandom vide pour ' + esc(CURRENT_SPLIT) + ')</option>';
    }
  } catch (e) {
    console.warn('LFL teams fetch failed', e);
    if (!cached) teamSelectEl.innerHTML = '<option>(Fandom rate-limit — réessaie dans 1 min)</option>';
  }
})();

async function onLoad() {
  const team = (teamInputEl.value || teamSelectEl.value).trim();
  if (!team) { setStatus("Choisis une équipe ou entre un nom.", true); return; }
  loadedTeam = team;
  setStatus(`Chargement de ${team}...`);
  clearOutput();
  lastSpError = null;
  try {
    const html = await fetchPickBanHistory(team);
    gamesAll = parsePickBanTable(html);
    if (!gamesAll.length) { setStatus('Aucune game trouvée.', true); return; }
    setStatus(`${gamesAll.length} games chargées. Fetching player-picks...`);
    const pages = Array.from(new Set(gamesAll.map(g => g.overviewPage).filter(Boolean)));
    try {
      playersRows = await fetchScoreboardPlayers(team, pages);
    } catch (err) {
      playersRows = [];
      lastSpError = err;
      console.warn('ScoreboardPlayers failed:', err);
    }
    populateTournamentDropdown(gamesAll);
    renderAll();
    if (lastSpError) {
      const msg = lastSpError instanceof RateLimitError
        ? '⚠ ' + lastSpError.message
        : '⚠ Picks par joueur indisponibles: ' + lastSpError.message;
      setStatus(`${gamesAll.length} games OK. ` + msg, true);
    } else {
      setStatus(`${gamesAll.length} games · ${playersRows.length} player rows.`);
    }
  } catch (err) {
    console.error(err);
    setStatus('Erreur: ' + err.message, true);
  }
}

function clearOutput() {
  $('#games').innerHTML = '';
  $('#picks').innerHTML = '';
  $('#games-head').style.display = 'none';
  $('#picks-head').style.display = 'none';
  tournamentEl.innerHTML = '<option>(charger d\'abord)</option>';
  tournamentEl.disabled = true;
}

function setStatus(msg, isError) {
  statusEl.textContent = msg || '';
  statusEl.style.color = isError ? '#b32b2b' : '';
}

async function fetchPickBanHistory(team) {
  const page = encodeURIComponent(team.replace(/ /g, '_') + '/Pick-Ban_History');
  const url = `${API}?action=parse&page=${page}&prop=text&format=json&origin=*`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  if (data.error) throw new Error(data.error.info || 'API error');
  if (!data.parse || !data.parse.text) throw new Error('Page introuvable');
  return data.parse.text['*'];
}

class RateLimitError extends Error {
  constructor(msg) { super(msg); this.name = 'RateLimitError'; }
}

async function fetchScoreboardPlayers(team, overviewPages) {
  const pageClause = (overviewPages && overviewPages.length)
    ? ' AND (' + overviewPages.map(p => `OverviewPage="${p.replace(/"/g, '')}"`).join(' OR ') + ')'
    : '';
  const where = encodeURIComponent(`Team="${team}"` + pageClause);
  const fields = encodeURIComponent('Link,Champion,Role,Team,OverviewPage,GameId,DateTime_UTC');
  const url = `${API}?action=cargoquery&tables=ScoreboardPlayers&fields=${fields}&where=${where}&limit=500&format=json&origin=*`;
  for (let attempt = 0; attempt < 3; attempt++) {
    setStatus(`Fetching player-picks (tentative ${attempt + 1}/3)...`);
    const r = await fetch(url);
    if (!r.ok) throw new Error(`ScoreboardPlayers HTTP ${r.status}`);
    const data = await r.json().catch(() => ({}));
    if (data.error && data.error.code === 'ratelimited') {
      const wait = 2000 * (attempt + 1);
      await new Promise(res => setTimeout(res, wait));
      continue;
    }
    if (data.error) throw new Error(data.error.info || 'Erreur API ScoreboardPlayers');
    return (data.cargoquery || []).map(x => x.title);
  }
  throw new RateLimitError("Rate-limit Fandom persistant sur ScoreboardPlayers après 3 tentatives. Les drafts sont OK, mais l'agrégat des picks par joueur reste vide — recharge dans ~1 min pour réessayer.");
}

function parsePickBanTable(htmlStr) {
  const doc = new DOMParser().parseFromString(htmlStr, 'text/html');
  const table = doc.getElementById('pbh-table');
  if (!table) return [];
  const rows = Array.from(table.querySelectorAll('tr')).slice(2);
  const games = [];
  for (const tr of rows) {
    const tds = tr.querySelectorAll('td');
    if (tds.length < 10) continue;
    const date = text(tds[0]);
    const tournament = text(tds[1]);
    const phase = text(tds[2]);
    // Extract the OverviewPage from the Phase link's href (e.g.
    // "/wiki/LFL/2026_Season/Spring_Split/Picks_and_Bans/Individual_Games#Week_2"
    // → "LFL/2026 Season/Spring Split"). Used to match ScoreboardPlayers rows.
    let overviewPage = '';
    const phaseLink = tds[2].querySelector('a[href*="/Picks_and_Bans/"]');
    if (phaseLink) {
      const href = phaseLink.getAttribute('href') || '';
      const m = href.match(/\/wiki\/(.+?)\/Picks_and_Bans\//);
      if (m) overviewPage = decodeURIComponent(m[1]).replace(/_/g, ' ');
    }
    const team1 = tds[3].getAttribute('title') || '?';
    const team2 = tds[4].getAttribute('title') || '?';
    const team1Side = tds[3].classList.contains('pbh-blue') ? 'B' : 'R';
    const team2Side = tds[4].classList.contains('pbh-blue') ? 'B' : 'R';
    const score = text(tds[5]);
    const result = text(tds[6]);
    const patch = text(tds[7]);
    const champs = [];
    for (const td of tds) {
      const c1 = td.getAttribute('data-c1');
      const c2 = td.getAttribute('data-c2');
      if (c1) champs.push(c1);
      if (c2) champs.push(c2);
    }
    if (champs.length !== DRAFT_SEQUENCE.length) continue;
    // Build lookup: "kind-side-n" -> champion
    const slotMap = {};
    DRAFT_SEQUENCE.forEach((s, i) => {
      slotMap[`${s.kind}-${s.side}-${s.n}`] = champs[i];
    });
    let winnerSide = null;
    if (result === 'Win')  winnerSide = team1Side;
    if (result === 'Loss') winnerSide = team2Side;
    const blueTeam = team1Side === 'B' ? team1 : team2;
    const redTeam  = team1Side === 'B' ? team2 : team1;
    games.push({ date, tournament, phase, overviewPage, team1, team2, team1Side,
                 blueTeam, redTeam, score, result, patch, slotMap, winnerSide });
  }
  return games;
}

function text(el) { return (el.textContent || '').trim(); }

function populateTournamentDropdown(games) {
  const tournaments = Array.from(new Set(games.map(g => g.tournament))).filter(Boolean);
  tournamentEl.innerHTML = '<option value="">(tous)</option>' +
    tournaments.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  tournamentEl.disabled = false;
}

function renderAll() {
  const filter = tournamentEl.value;
  const games = filter ? gamesAll.filter(g => g.tournament === filter) : gamesAll;
  renderGames(games);
  renderAggregate(games);
  const copyAllEl = $('#copy-all');
  if (games.length) {
    $('#games-head').style.display = '';
    $('#picks-head').style.display = '';
    copyAllEl.style.display = '';
  } else {
    copyAllEl.style.display = 'none';
  }
}

async function copyAll(btn) {
  const draftTable = $('#games table');
  const picksTable = $('#picks table');
  const parts = [];
  if (draftTable) parts.push(draftTable.outerHTML);
  if (picksTable) parts.push(picksTable.outerHTML);
  if (!parts.length) return;
  // Small gap between the two tables when pasted.
  const html = parts.join('<br><br>');
  const text = [draftTable?.innerText, picksTable?.innerText].filter(Boolean).join('\n\n');
  const originalLabel = btn.textContent;
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html':  new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([text], { type: 'text/plain' }),
      }),
    ]);
    btn.textContent = '✓ Tout copié';
  } catch (e) {
    console.warn('Clipboard write failed, falling back to selection', e);
    const range = document.createRange();
    const frag = document.createDocumentFragment();
    if (draftTable) frag.appendChild(draftTable.cloneNode(true));
    if (picksTable) frag.appendChild(picksTable.cloneNode(true));
    const host = document.createElement('div');
    host.appendChild(frag);
    document.body.appendChild(host);
    range.selectNodeContents(host);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges(); host.remove();
    btn.textContent = '✓ Tout copié (fallback)';
  }
  setTimeout(() => { btn.textContent = originalLabel; }, 2500);
}

const GAMES_PER_ROW = 6;
const CELL_BORDER = '1px solid #999';
const SPACER_COL_W = '14px';
const SPACER_ROW_H = '20px';

// Render one single big flat table: games laid out side-by-side in the SAME
// <table>, with spacer columns between games and spacer rows between game-blocks.
// This is what Google Sheets / Docs handle cleanly on paste.
function renderGames(games) {
  const container = $('#games');
  container.innerHTML = '';
  if (!games.length) return;
  container.appendChild(buildGamesTable(games));
}

function buildGamesTable(games) {
  const table = document.createElement('table');
  table.style.borderCollapse = 'collapse';
  table.style.fontFamily = 'Arial, sans-serif';
  table.style.fontSize = '12px';

  for (let i = 0; i < games.length; i += GAMES_PER_ROW) {
    const block = games.slice(i, i + GAMES_PER_ROW);
    appendBlockRows(table, block);
    // Blank spacer row between game-blocks (delimiter).
    if (i + GAMES_PER_ROW < games.length) {
      const spacer = table.insertRow();
      const td = spacer.insertCell();
      td.setAttribute('colspan', block.length * 3);
      td.style.height = SPACER_ROW_H;
      td.style.border = 'none';
    }
  }
  return table;
}

// Build 20 rows (label + header + 18 layout) for one horizontal block of up to
// GAMES_PER_ROW games. Each game takes 2 columns; a narrow 3rd spacer column
// sits between games (not after the last game).
function appendBlockRows(table, games) {
  // Row 1: "<WIN> win" label above each game.
  const labelRow = table.insertRow();
  games.forEach((g, i) => {
    const winner = g.winnerSide === 'B' ? tricode(g.blueTeam)
                 : g.winnerSide === 'R' ? tricode(g.redTeam) : '';
    const td = labelRow.insertCell();
    td.setAttribute('colspan', 2);
    td.textContent = winner ? winner + ' win' : '';
    td.style.cssText = 'padding:2px 2px 4px 2px;border:none;font-size:11px;color:#333;';
    if (i < games.length - 1) addSpacerCell(labelRow);
  });

  // Row 2: team headers (dark bg, white text; winner gets " win").
  const headRow = table.insertRow();
  games.forEach((g, i) => {
    const blueWin = g.winnerSide === 'B';
    const redWin  = g.winnerSide === 'R';
    const b = headRow.insertCell();
    b.textContent = tricode(g.blueTeam) + (blueWin ? ' win' : '');
    b.style.cssText = `background-color:${COLORS.headerBlue};color:${COLORS.headerInk};font-weight:bold;padding:3px 6px;border:${CELL_BORDER};`;
    const r = headRow.insertCell();
    r.textContent = tricode(g.redTeam) + (redWin ? ' win' : '');
    r.style.cssText = `background-color:${COLORS.headerRed};color:${COLORS.headerInk};font-weight:bold;padding:3px 6px;border:${CELL_BORDER};`;
    if (i < games.length - 1) addSpacerCell(headRow);
  });

  // Rows 3..20: the 18 LAYOUT rows (14 content + 4 separators).
  for (const layoutRow of LAYOUT) {
    const tr = table.insertRow();
    games.forEach((g, i) => {
      if (layoutRow.sep) {
        appendEmptyPair(tr);
      } else {
        appendSlotCell(tr, layoutRow.blue, 'B', g.slotMap);
        appendSlotCell(tr, layoutRow.red, 'R', g.slotMap);
      }
      if (i < games.length - 1) addSpacerCell(tr);
    });
  }
}

function addSpacerCell(row) {
  const td = row.insertCell();
  td.style.width = SPACER_COL_W;
  td.style.minWidth = SPACER_COL_W;
  td.style.border = 'none';
  td.innerHTML = '&nbsp;';
}

function appendEmptyPair(row) {
  for (let k = 0; k < 2; k++) {
    const td = row.insertCell();
    td.style.border = 'none';
    td.style.height = '6px';
    td.innerHTML = '&nbsp;';
  }
}

function appendSlotCell(row, slot, side, slotMap) {
  const td = row.insertCell();
  if (!slot) {
    td.style.cssText = `border:${CELL_BORDER};padding:2px 6px;`;
    td.innerHTML = '&nbsp;';
    return;
  }
  const key = `${slot.kind}-${side}-${slot.n}`;
  const champ = slotMap[key] || '';
  const bg = slot.kind === 'ban'
    ? COLORS.banGrey
    : (side === 'B' ? COLORS.pickBlue : COLORS.pickRed);
  td.style.cssText = `background-color:${bg};border:${CELL_BORDER};padding:2px 6px;`;
  td.textContent = formatChampion(champ);
  if (!champ) td.innerHTML = '&nbsp;';
}

// --- Aggregate table ------------------------------------------------------

function renderAggregate(games) {
  const wrap = $('#picks');
  wrap.innerHTML = '';
  // Cargo returns field keys with spaces when the column name had underscores.
  const allowedPages = new Set(games.map(g => g.overviewPage).filter(Boolean));
  const allowedDates = new Set(games.map(g => g.date));
  const rows = playersRows.filter(r => {
    const op = r.OverviewPage || '';
    if (allowedPages.has(op)) return true;
    // Fallback: match by date if overview page wasn't extracted.
    const raw = r['DateTime UTC'] || r.DateTime_UTC || '';
    return allowedDates.has(raw.slice(0, 10));
  });
  if (!rows.length) {
    if (lastSpError instanceof RateLimitError) {
      wrap.innerHTML = '<p class="copy-hint" style="color:#b32b2b;font-weight:bold">⚠ Rate-limit Fandom sur ScoreboardPlayers. Patiente ~1 min puis clique "Charger" à nouveau.</p>';
    } else if (lastSpError) {
      wrap.innerHTML = '<p class="copy-hint" style="color:#b32b2b">⚠ Erreur fetch picks: ' + esc(lastSpError.message) + '</p>';
    } else {
      wrap.innerHTML = '<p class="copy-hint">Pas de données joueur pour ce filtre (SP table vide côté Fandom).</p>';
    }
    return;
  }
  // Group by Role -> by Player -> counts of Champion
  const byRole = {};
  for (const r of rows) {
    const role = r.Role || '?';
    const player = r.Link || '?';
    const champ = r.Champion || '';
    if (!byRole[role]) byRole[role] = {};
    if (!byRole[role][player]) byRole[role][player] = {};
    byRole[role][player][champ] = (byRole[role][player][champ] || 0) + 1;
  }
  wrap.appendChild(renderAggregateTable(loadedTeam, byRole));
}

function renderAggregateTable(teamName, byRole) {
  const container = document.createElement('div');
  // Keep role order, fallback to whatever roles exist.
  const roles = ROLE_ORDER.filter(r => byRole[r]);
  for (const r of Object.keys(byRole)) if (!roles.includes(r)) roles.push(r);
  // For each role, pick the single player (most games for that role) — LFL has a starter per role.
  const perRole = roles.map(r => {
    const playerCounts = Object.entries(byRole[r]).map(([p, cs]) => ({
      player: p,
      totalGames: Object.values(cs).reduce((a,b)=>a+b, 0),
      champs: cs,
    }));
    playerCounts.sort((a,b) => b.totalGames - a.totalGames);
    return { role: r, ...playerCounts[0] };
  });
  // Max column height.
  const maxRows = Math.max(...perRole.map(p => Object.keys(p.champs).length));
  // Build sorted champion list per player: by count desc.
  const sortedPerPlayer = perRole.map(p => {
    const list = Object.entries(p.champs).map(([c, n]) => ({ champ: c, n }));
    list.sort((a,b) => b.n - a.n || a.champ.localeCompare(b.champ));
    return list;
  });

  let html = `<table class="picks">`;
  html += `<caption style="background-color:${COLORS.aggFirst};">${esc(tricode(teamName))} Competitive picks</caption>`;
  html += `<thead><tr>`;
  for (const p of perRole) html += `<th>${esc(p.player)}</th>`;
  html += `</tr></thead><tbody>`;
  for (let i = 0; i < maxRows; i++) {
    html += `<tr>`;
    for (let c = 0; c < perRole.length; c++) {
      const cell = sortedPerPlayer[c][i];
      if (!cell) { html += `<td>&nbsp;</td>`; continue; }
      const label = formatChampion(cell.champ) + (cell.n > 1 ? ` x${cell.n}` : '');
      const bg = cell.n > 1 ? ` style="background-color:${COLORS.aggFirst};"` : '';
      html += `<td${bg}>${esc(label)}</td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table>`;
  container.innerHTML = html;
  return container;
}

// --- Formatting helpers ---------------------------------------------------

const CHAMPION_NAME_OVERRIDES = {
  jarvaniv: 'Jarvan IV', xinzhao: 'Xin Zhao', ksante: "K'Sante",
  khazix: "Kha'Zix", velkoz: "Vel'Koz", chogath: "Cho'Gath",
  reksai: "Rek'Sai", kogmaw: "Kog'Maw", kaisa: "Kai'Sa",
  leesin: 'Lee Sin', masteryi: 'Master Yi', tahmkench: 'Tahm Kench',
  missfortune: 'Miss Fortune', aurelionsol: 'Aurelion Sol',
  twistedfate: 'Twisted Fate', drmundo: 'Dr. Mundo',
  nunuwillump: 'Nunu & Willump', monkeyking: 'Wukong',
};
function formatChampion(key) {
  if (!key) return '';
  if (CHAMPION_NAME_OVERRIDES[key]) return CHAMPION_NAME_OVERRIDES[key];
  return key.charAt(0).toUpperCase() + key.slice(1);
}

// Heuristic tricode from team name (coach will edit if they want official shortnames).
function tricode(name) {
  if (!name) return '';
  const words = name.replace(/[.,]/g, '').split(/\s+/).filter(Boolean);
  if (words.length === 1) {
    const w = words[0];
    return w.length <= 4 ? w.toUpperCase() : w.slice(0, 3).toUpperCase();
  }
  return words.map(w => w[0]).join('').toUpperCase().slice(0, 4);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
